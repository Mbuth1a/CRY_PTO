<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>FraudLab — Synthetic Exchange</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="container small">
    <div class="warning">
         REAL MONEY, EXCHANGES OR PAYMENT NETWORKS
    </div>
    <div class="card">
        <h1>CoinBase Exchange</h1>
        <p class="muted">CRY_PTO trading-platform</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login/">
            {% csrf_token %}
            <label>Username</label>
            <input name="username" value="labuser">

            <label>Password</label>
            <input type="password" name="password" value="LabOnly-ChangeMe-123!">

            <button>Login</button>
        </form>
    </div>
</div>
</body>
</html>
