<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Auric</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            margin: 0;
            color: #ff8c00;
            font-size: 32px;
        }

        .brand p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.12);
        }

        .error {
            background: #fff1f1;
            color: #b42318;
            border: 1px solid #f2b8b5;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            border: none;
            background: #ff8c00;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #e67c00;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .auth-footer a {
            color: #ff8c00;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="brand">
            <h1>Auric</h1>
            <p>Sign in to your trading dashboard</p>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if next %}
            {% if user.is_authenticated %}
                <div class="error">
                    Your account does not have permission to access this page.
                </div>
            {% endif %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
    {% csrf_token %}

            <div class="form-group">
                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">
                Create an account
            </a>
        </div>

    </div>

</div>

</body>
</html>
